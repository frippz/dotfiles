---
- defaults:
    link:
      force: true

- clean: ["~"]

- create:
    - ~/.config/nvim
    - ~/.config/mise
    - ~/.config/tmux
    - ~/.claude/skills

- link:
    ~/.zshrc: zsh/zshrc
    ~/.scripts: scripts
    ~/.config/ghostty: ghostty
    ~/.config/mise/config.toml: mise/config.toml
    ~/.config/nvim/init.lua: nvim/init.lua
    ~/.config/nvim/lua: nvim/lua
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    # ~/.config/tmux/plugins: tmux/plugins
    ~/.config/tmuxp: tmuxp
    ~/.dircolors.ansi-dark: zsh/dircolors.ansi-dark
    ~/.dircolors.ansi-light: zsh/dircolors.ansi-light
    ~/.ripgreprc: ripgrep/ripgreprc
    ~/.gitconfig: git/gitconfig
    ~/.gitignore: git/gitignore
    ~/.claude/settings.json: claude/settings.json
    ~/.claude/skills/:
      glob: true
      path: claude/skills/*

- shell:
    - description: Install Homebrew & predefined packages
      command: ./homebrew/install.sh
      stdout: true

    - description: Install Node
      command: ./node/install.sh
      stdout: true

    - description: Install bob
      command: ./bob/install.sh
      stdout: true

    - description: Install eza
      command: ./eza/install.sh
      stdout: true

    - description: Install zoxide
      command: ./zoxide/install.sh
      stdout: true

    - description: Install Claude Code
      command: ./claude/install.sh
      stdout: true
